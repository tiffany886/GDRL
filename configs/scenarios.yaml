# ============================================================
# 三个预设实验场景配置
# 这些场景是对论文原始配置的扩展，用于横向对比不同规模的网络
# 注意：L 和 N 不能超过 16（受离散动作编码 4-bit 限制）
# ============================================================

scenarios:

  # ── 小规模场景：用于快速验证算法流程 ──────────────────────
  small:
    U: 3           # 3 个地面用户
    L: 8           # 8 颗 LEO 卫星
    N: 8           # 8 个 HAPS 平台
    T: 100         # 100 个时隙
    description: "快速验证场景，适合调试和初步对比"

  # ── 中规模场景：开始体现图结构建模的价值 ──────────────────
  medium:
    U: 6           # 6 个地面用户
    L: 12          # 12 颗 LEO 卫星
    N: 12          # 12 个 HAPS 平台
    T: 100
    description: "中等规模，用户和节点增加，验证可扩展性"

  # ── 大规模场景：当前编码上限内的复杂拓扑 ──────────────────
  large:
    U: 10          # 10 个地面用户
    L: 16          # 16 颗 LEO 卫星（当前最大值）
    N: 16          # 16 个 HAPS 平台（当前最大值）
    T: 100
    description: "大规模场景，接近当前动作编码上限"

  # ── 论文原始配置（与默认 arg_parser 一致）──────────────────
  paper:
    U: 3
    L: 16          # 论文使用 16 颗 LEO
    N: 16          # 论文使用 16 个 HAPS
    T: 100
    description: "IEEE JSAC 2025 论文原始实验配置"
